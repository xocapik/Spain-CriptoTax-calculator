<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Suite — CryptoTax ES</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js" integrity="sha512-dfX5uYVXzyU8+KHqj8bjo7UkOdg18PaOtpa48djpNbZHwExddghZ+ZmzWT06R5v6NSk3ZUfsH6FNEDepLx9hPQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js" integrity="sha512-+BMamP0e7wn39JGL8nKAZ3yAQT2dL5oaXWr4ZYlTGkKOaoXM/Yj7c4oy50Ngz5yoUutAG17flueD4F6QpTlPng==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <style>
        :root {
            --bg: #0b0f1e;
            --surface: rgba(18, 26, 52, 0.85);
            --border: rgba(99, 119, 200, 0.18);
            --accent: #6366f1;
            --success: #22c55e;
            --danger: #f43f5e;
            --text: #e8eaf8;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 2rem;
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }
        .logo h1 { font-size: 1.5rem; }
        .logo span { color: var(--accent); }
        .back-link { text-decoration: none; color: var(--accent); font-weight: 600; }
        
        .test-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        .test-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .status-pill {
            padding: 0.2rem 0.6rem;
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .status-pass { background: rgba(34, 197, 94, 0.15); color: var(--success); border: 1px solid var(--success); }
        .status-fail { background: rgba(244, 63, 94, 0.15); color: var(--danger); border: 1px solid var(--danger); }
        
        ul { list-style: none; padding: 0; }
        li {
            padding: 0.75rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        li:last-child { border-bottom: none; }
        .result-msg { font-size: 0.9rem; }
        .result-icon { font-weight: bold; }
        
        pre {
            background: rgba(0,0,0,0.3);
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.8rem;
            overflow-x: auto;
            margin-top: 0.5rem;
            color: #ff9d9d;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo"><h1>Crypto<span>Tax</span> ES — 🧪 Test Suite</h1></div>
        <a href="index.html" class="back-link">← Volver a la App</a>
    </header>

    <div id="test-results">
        <p>Ejecutando batería de pruebas unitarias...</p>
    </div>

    <script src="utils/security.js"></script>
    <script src="utils/engine.js"></script>
    <script src="utils/parsers.js"></script>
    <script src="tests.js"></script>
</body>
</html>
